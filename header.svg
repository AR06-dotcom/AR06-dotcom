<svg width="850" height="280" xmlns="http://www.w3.org/2000/svg">
  <style>
    /* Text Animations */
    .name { font: bold 60px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: white; animation: fadeUp 1s ease-out forwards; opacity: 0; }
    .sub { font: bold 20px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: white; animation: fadeUp 1s ease-out 0.3s forwards; opacity: 0; }
    .mono { font: 22px 'Courier New', Courier, monospace; fill: #00A6FF; animation: fadeUp 1s ease-out 0.6s forwards; opacity: 0; }
    
    /* Background Blob Animation */
    .blob { animation: float 8s ease-in-out infinite; transform-origin: 425px 130px; }
    
    /* Line Draw Animation */
    .line { stroke-dasharray: 770; stroke-dashoffset: 770; animation: drawLine 1.5s ease-in-out 0.8s forwards; }

    /* Keyframes */
    @keyframes fadeUp {
      0% { opacity: 0; transform: translateY(15px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0) scale(1) rotate(0deg); }
      50% { transform: translateY(-10px) scale(1.05) rotate(3deg); }
    }
    @keyframes drawLine {
      0% { stroke-dashoffset: 770; }
      100% { stroke-dashoffset: 0; }
    }
  </style>
  
  <rect width="100%" height="100%" fill="#0D1117" rx="10" />
  
  <path class="blob" d="M425,30 C500,20 540,90 510,150 C480,210 390,230 330,180 C270,130 310,50 425,30 Z" fill="#1C2E4A" opacity="0.9"/>

  <text x="425" y="125" class="name" text-anchor="middle">Aryan Rahate</text>
  <text x="425" y="170" class="sub" text-anchor="middle">BCA • Coding • Logic</text>

  <line x1="40" y1="210" x2="810" y2="210" stroke="#30363D" stroke-width="2" class="line"/>
  
  <text x="425" y="247" class="mono" text-anchor="middle">Logic Driven Problem Solving</text>
  
  <line x1="40" y1="270" x2="810" y2="270" stroke="#30363D" stroke-width="2" class="line"/>
</svg>
